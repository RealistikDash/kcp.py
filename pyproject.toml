[project]
name = "kcp"
version = "1.0.0"
description = "Python bindings and networking for the KCP protocol."
readme = "README.md"
license = "MIT"
authors = [{ name = "RealistikDash" }]
requires-python = ">=3.10"
keywords = ["kcp", "server", "client", "async", "asyncio"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=7.2.1"]

[project.urls]
Homepage = "https://github.com/RealistikDash/kcp.py"
Repository = "https://github.com/RealistikDash/kcp.py"
Documentation = "https://github.com/RealistikDash/kcp.py"
Issues = "https://github.com/RealistikDash/kcp.py/issues"

[build-system]
requires = ["setuptools>=68", "cython>=3.0.11"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["kcp*"]

[tool.setuptools.package-data]
kcp = ["py.typed", "*.pyi"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = ["pp*", "*-musllinux_*", "*_i686", "*_win32"]
build-frontend = "build"
test-extras = ["test"]
test-command = "pytest {project}/tests"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long — handled by formatter
]

[tool.ruff.lint.isort]
force-single-line = true
required-imports = ["from __future__ import annotations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
